<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northwind Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Segoe UI", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <script>
      window.NORTHWIND_API = window.NORTHWIND_API || "http://127.0.0.1:8000";
    </script>
  </head>
  <body class="min-h-screen bg-slate-100 font-sans text-slate-900">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="mb-8 flex flex-col gap-4 rounded-3xl bg-white p-6 shadow-sm sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">Northwind API</p>
          <h1 class="text-3xl font-bold tracking-tight">Yönetim Paneli</h1>
          <p class="mt-1 text-sm text-slate-500">Müşteri, kategori ve ürün kayıtlarını yönetin.</p>
        </div>
        <div class="flex items-center gap-3">
          <span id="api-status" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600">Bağlanıyor...</span>
          <p id="api-hint" class="hidden max-w-xs text-right text-xs text-rose-600"></p>
          <a
            href="/docs"
            class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
            target="_blank"
            rel="noreferrer"
          >
            API Docs
          </a>
        </div>
      </header>

      <section class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div id="tabs" class="flex flex-wrap gap-2"></div>
        <div class="flex gap-2">
          <button
            id="btn-refresh"
            class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
          >
            Yenile
          </button>
          <button
            id="btn-new"
            class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800"
          >
            Yeni Kayıt
          </button>
        </div>
      </section>

      <section class="overflow-hidden rounded-3xl bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
          <div>
            <h2 id="page-title" class="text-lg font-semibold">Müşteriler</h2>
            <p id="record-count" class="text-sm text-slate-500">0 kayıt</p>
          </div>
          <div id="loading" class="hidden text-sm text-slate-500">Yükleniyor...</div>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full">
            <thead id="table-head" class="bg-slate-50"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="modal" class="fixed inset-0 z-40 hidden bg-slate-900/40 backdrop-blur-sm">
      <div class="flex min-h-full items-center justify-center p-4">
        <div class="w-full max-w-lg rounded-3xl bg-white p-6 shadow-xl">
          <div class="mb-4 flex items-center justify-between">
            <h3 id="modal-title" class="text-lg font-semibold">Yeni Kayıt</h3>
            <button id="btn-close-modal" class="rounded-lg px-2 py-1 text-slate-500 hover:bg-slate-100">✕</button>
          </div>
          <form id="modal-form" class="space-y-4"></form>
          <div class="mt-6 flex justify-end gap-2">
            <button
              id="btn-cancel"
              type="button"
              class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
            >
              İptal
            </button>
            <button
              type="submit"
              form="modal-form"
              class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800"
            >
              Kaydet
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden rounded-xl px-4 py-3 text-sm font-medium shadow-lg"></div>

    <script src="/static/app.js?v=2"></script>
  </body>
</html>
